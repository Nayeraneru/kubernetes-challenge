name: ecom-web

on:
  pull_request:
  push:
    branches: [main]
    tags: ["v*"]

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Lint Dockerfile
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: app/Dockerfile

      - uses: docker/setup-buildx-action@v3

      - name: Build image (kept local for testing)
        uses: docker/build-push-action@v6
        with:
          context: ./app
          load: true
          tags: ecom-web:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Integration test (web + db)
        env:
          WEB_IMAGE: ecom-web:ci
        run: |
          cp .env.example .env
          docker compose up -d --wait
          curl -fsS --retry 10 --retry-delay 2 --retry-all-errors http://localhost:8080 | grep Laptop > /dev/null
          docker compose down -v

      - name: Dump logs on failure
        if: failure()
        run: docker compose logs

      - name: Vulnerability scan (report only for now)
        uses: aquasecurity/trivy-action@v0.29.0
        with:
          image-ref: ecom-web:ci
          severity: HIGH,CRITICAL
          exit-code: "0"

      - name: Log in to Docker Hub
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Compute tags
        id: meta
        if: github.event_name != 'pull_request'
        uses: docker/metadata-action@v5
        with:
          images: ${{ vars.DOCKERHUB_USERNAME }}/ecom-web
          tags: |
            type=sha
            type=ref,event=tag

      - name: Push
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@v6
        with:
          context: ./app
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
